# รันระบบที่ร้าน — แอปอยู่ในคอนเทนเนอร์ ฐานข้อมูลอยู่บน SQL Server อีกเครื่อง
#
#   docker compose up -d --build
#   docker compose exec app php artisan db:seed      # ครั้งแรกครั้งเดียว
#
# ค่าที่เป็นความลับอ่านจากไฟล์ .env ที่อยู่ข้าง ๆ ไฟล์นี้ (ไม่ใช่ .env ของ Laravel)
# อย่างน้อยต้องมี: APP_KEY, APP_URL, DB_HOST, DB_DATABASE, DB_USERNAME, DB_PASSWORD

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      # 8080 คือพอร์ตบนเครื่องที่ร้าน เปลี่ยนได้ตามสะดวก
      - "8080:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?ต้องตั้ง APP_KEY — สร้างด้วย php artisan key:generate --show}
      # ต้องเป็น IP หรือชื่อเครื่องที่มือถือลูกค้าในร้านเรียกถึงได้ ห้ามเป็น localhost
      # ไม่งั้น QR โต๊ะและลิงก์ที่ระบบสร้างจะใช้ไม่ได้
      APP_URL: ${APP_URL:?ต้องตั้ง APP_URL เป็น IP หรือโดเมนที่เครื่องอื่นเรียกถึงได้}
      APP_TIMEZONE: Asia/Bangkok
      APP_LOCALE: th
      APP_FALLBACK_LOCALE: en

      DB_CONNECTION: sqlsrv
      DB_HOST: ${DB_HOST:?ต้องตั้ง DB_HOST}
      DB_PORT: ${DB_PORT:-1433}
      DB_DATABASE: ${DB_DATABASE:?ต้องตั้ง DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME:?ต้องตั้ง DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?ต้องตั้ง DB_PASSWORD}
      DB_PREFIX: POS2_
      DB_TRUST_SERVER_CERTIFICATE: "true"

      SESSION_DRIVER: database
      SESSION_LIFETIME: "480"
      CACHE_STORE: database
      QUEUE_CONNECTION: database

      # ปิดเสมอนอกเครื่องพัฒนา — ถ้าเปิดค้าง รหัส OTP จะโชว์บนหน้าจอ
      # แล้วใครก็ล็อกอินเป็นลูกค้าคนไหนก็ได้ (config/foodpos.php บังคับปิดซ้ำอีกชั้น)
      FOODPOS_OTP_DRIVER: log
      FOODPOS_OTP_EXPOSE: "false"

    volumes:
      # รูปเมนูและสลิปโอนเงินที่พนักงานอัปโหลด — ถ้าไม่ผูก volume ไว้
      # ของพวกนี้จะหายทุกครั้งที่ build image ใหม่
      - pos-uploads:/var/www/html/storage/app/public
      - pos-logs:/var/www/html/storage/logs

volumes:
  pos-uploads:
  pos-logs:
