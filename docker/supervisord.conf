[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ตัวตั้งเวลาของ Laravel — ดูตารางงานได้ที่ routes/console.php
;
; ถ้าไม่มีตัวนี้ คำสั่งที่เขียนไว้จะไม่มีใครเรียกเลย:
;   printers:work  ใบที่พิมพ์พลาดตอนกระดาษหมดจะค้างคิวตลอดไป
;   sales:export   ต้องเข้าหลังบ้านกดส่งข้อมูลให้บัญชีเองทุกวัน
;
; schedule:work คือตัวที่รันค้างไว้แล้วเรียกงานตามตารางเองทุกนาที
; ไม่ต้องตั้ง cron ของเครื่องแยก
[program:schedule]
command=php /var/www/html/artisan schedule:work
user=www-data
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
